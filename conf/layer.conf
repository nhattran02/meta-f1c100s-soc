# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-f1c100s-soc"
BBFILE_PATTERN_meta-f1c100s-soc = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-f1c100s-soc = "6"

LAYERDEPENDS_meta-f1c100s-soc = "core"
LAYERSERIES_COMPAT_meta-f1c100s-soc = "scarthgap"
