#@TYPE: Machine
#@NAME: F1C100s SOC
#@DESCRIPTION: Machine configuration for the F1C100s SoC

DEFAULTTUNE ?= "arm926ejs"
require conf/machine/include/arm/armv5/tune-arm926ejs.inc

SOC_FAMILY = "suniv:f1c100s"
require conf/machine/include/soc-family.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.6%"
KERNEL_IMAGETYPE = "zImage"
KERNEL_DEVICETREE = "allwinner/suniv-f1c100s-licheepi-nano.dtb"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
EXTRA_IMAGEDEPENDS += "virtual/bootloader"
UBOOT_MACHINE = "licheepi_nano_defconfig"
SPL_BINARY = "u-boot-sunxi-with-spl.bin"

SERIAL_CONSOLES = "115200;ttyS0"

IMAGE_FSTYPES += "tar.xz wic wic.bmap"
WKS_FILE = "f1c100s-sdcard.wks"
WKS_FILE_DEPENDS:append = " virtual/bootloader"
IMAGE_BOOT_FILES = "${KERNEL_IMAGETYPE} suniv-f1c100s-licheepi-nano.dtb boot.scr"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS = "kernel-image kernel-devicetree"
MACHINE_FEATURES = "ext2 serial usbhost vfat"
